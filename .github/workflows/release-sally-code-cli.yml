name: release-sally-code-cli

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.14.49"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="v${VERSION#v}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes "Sally Code $TAG" --latest
          fi

      - name: Build and upload CLI archives
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_RELEASE: "1"
          OPENCODE_CHANNEL: latest
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          export OPENCODE_VERSION="${VERSION#v}"
          ./packages/opencode/script/build.ts

      - name: Upload installer scripts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="v${VERSION#v}"
          gh release upload "$TAG" install install.ps1 --clobber --repo "${{ github.repository }}"
